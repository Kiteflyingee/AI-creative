name: ai-creative

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aicreative
      POSTGRES_PASSWORD: aicreative
      POSTGRES_DB: aicreative
    ports:
      - "5432:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicreative"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - ./.data/redis:/data

  # Docker Hub 上的 minio/minio 已不可用，改用 Bitnami 存档镜像；启动时自动创建存储桶
  minio:
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKETS: ai-creative,ai-creative-test
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/bitnami/minio/data

volumes:
  minio-data:
